# Deploy VitePress docs to GitHub Pages:
# https://thaikolja.github.io/nuxt-toc/

name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'logo.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync logo into docs public
        run: mkdir -p docs/public && cp logo.png docs/public/logo.png

      - name: Build VitePress
        run: npm run docs:build
        env:
          CI: 'true'
          DOCS_SITE_URL: https://thaikolja.github.io/nuxt-toc
          DOCS_BASE: /nuxt-toc/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
